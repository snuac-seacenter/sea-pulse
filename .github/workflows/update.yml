# 동남아 데일리 브리프 자동 갱신
# 1) 구글 드라이브 폴더의 YYYY-MM-DD.json 을 가져와 검사 → briefs/ 에 공개본 저장·커밋
# 2) 페이지를 다시 만들어 GitHub Pages 에 게시
# 3) 게시하지 못한 파일이 새로 생기면 작업을 '실패'로 표시 → 계정 메일로 알림
#    (바뀐 브리프가 없는 정시 실행은 게시 단계를 건너뜀)
name: 브리프 갱신

on:
  schedule:
    - cron: '23 * * * *'        # 매시 23분 (UTC 기준이지만 매시라 시차 무관)
  workflow_dispatch: {}          # Actions 탭에서 'Run workflow' 로 즉시 실행
  push:
    branches: [main]
    paths: ['web/**', 'scripts/**', 'schema/**', 'briefs/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: brief-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      GDRIVE_FOLDER_ID: ${{ vars.GDRIVE_FOLDER_ID || '1Ufk983IY9DQ7rIwa3bPz0SLWUuw9hrmb' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: pip install -q google-api-python-client google-auth jsonschema

      - name: 드라이브에서 브리프 가져오기
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: |
          if [ -z "$GDRIVE_SA_KEY" ]; then
            echo "GDRIVE_SA_KEY 시크릿이 없어 드라이브 동기화를 건너뜁니다."
            : > .sync_problems
          else
            python scripts/sync_drive.py
          fi

      - name: 새 브리프 커밋
        id: commit
        run: |
          if [ -n "$(git status --porcelain briefs state)" ]; then
            git config user.name  "sea-pulse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add briefs state
            git commit -m "브리프 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "새로 바뀐 브리프 없음"
          fi

      - name: 페이지 만들기
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        run: |
          python scripts/build_site.py
          python scripts/make_html.py

      - uses: actions/configure-pages@v5
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'

      - uses: actions/upload-pages-artifact@v3
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: _site

      - name: 게시
        id: deploy
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4

      - name: 게시하지 못한 파일 확인
        run: |
          if [ -s .sync_problems ]; then
            echo "::error::게시하지 못한 브리프 파일이 있습니다. 위 '드라이브에서 브리프 가져오기' 단계 로그를 확인하세요."
            cat .sync_problems
            exit 1
          fi
